<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>页面不存在 · vkuiqi</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #FAFAFB; color: #344054;
  }
  .box { text-align: center; padding: 32px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; color: #101828; }
  p { font-size: 14px; color: #667085; margin: 0 0 20px; }
  a {
    display: inline-block; padding: 8px 20px; border-radius: 7px;
    background: #4F46E5; color: #fff; text-decoration: none; font-size: 14px;
  }
</style>
</head>
<body>
<div class="box">
  <h1>这个地址没有内容</h1>
  <p>可能是链接写错了，也可能是页面还没建。</p>
  <a href="/">回到首页</a>
</div>
<script>
  (function () {
    var p = location.pathname.replace(/\.html$/, '').replace(/\/+$/, '');
    if (p && p !== '') {
      setTimeout(function () { location.replace('/#/' + p.replace(/^\//, '')); }, 1200);
    }
  })();
</script>
</body>
</html>
