<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>跳转中 · vkuiqi</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #FAFAFB; color: #344054;
  }
  .box { text-align: center; padding: 32px; }
  p { font-size: 14px; color: #667085; margin: 0 0 18px; }
  a {
    display: inline-block; padding: 8px 20px; border-radius: 7px;
    background: #4F46E5; color: #fff; text-decoration: none; font-size: 14px;
  }
</style>
<script>
  (function () {
    var p = location.pathname.replace(/\.html$/, '').replace(/\/+$/, '');
    if (p && p !== '') {
      location.replace('/#/' + p.replace(/^\//, ''));
    } else {
      location.replace('/#/');
    }
  })();
</script>
</head>
<body>
<div class="box">
  <p>正在打开…如果没有自动跳转，点下面的按钮。</p>
  <a href="/">回到首页</a>
</div>
</body>
</html>
