<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>vkuiqi</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="assets/vendor/vue.css">
<style>
  :root {
    --theme-color: #4F46E5;
    --base-font-size: 15px;
  }
  body { background: #FFFFFF; }
  .sidebar { padding-top: 22px; background: #FAFAFB; border-right: 1px solid #EFF1F5; }
  .sidebar .app-name-link { font-weight: 650; letter-spacing: -0.01em; }
  .sidebar ul li a { font-size: 14px; color: #475467; }
  .sidebar ul li.active > a { color: #4F46E5; font-weight: 600; }
  .sidebar ul li > p { font-size: 12px; color: #98A2B3; font-weight: 600; letter-spacing: 0.03em; }
  .markdown-section { max-width: 780px; padding-top: 32px; }
  .markdown-section h1 { font-size: 28px; font-weight: 650; letter-spacing: -0.02em; }
  .markdown-section h2 {
    font-size: 20px; font-weight: 600; margin-top: 40px;
    padding-bottom: 8px; border-bottom: 1px solid #EFF1F5;
  }
  .markdown-section h3 { font-size: 16.5px; font-weight: 600; }
  .markdown-section p, .markdown-section li { line-height: 1.85; color: #344054; }
  .markdown-section a { color: #4F46E5; text-decoration: none; }
  .markdown-section a:hover { text-decoration: underline; }
  .markdown-section table { display: table; width: 100%; }
  .markdown-section th { background: #F7F8FA; font-weight: 600; }
  .markdown-section blockquote {
    border-left: 3px solid #4F46E5; background: #F7F8FA;
    padding: 10px 16px; color: #475467; margin: 16px 0;
  }
  .markdown-section code { background: #F7F8FA; color: #B42318; }
  .markdown-section img { border-radius: 8px; }
  .search input { border-radius: 7px; }
  .search .results-panel { border-radius: 8px; }
</style>
</head>
<body>
<div id="app">正在加载…</div>
<script>
window.$docsify = {
  name: 'vkuiqi',
  repo: 'vkuiqi/vkuiqi.github.io',
  loadSidebar: true,
  subMaxLevel: 2,
  maxLevel: 3,
  autoHeader: true,
  routerMode: 'hash',
  notFoundPage: true,
  search: {
    placeholder: '搜索全站',
    noData: '没找到相关内容',
    depth: 3
  },
  externalLinkTarget: '_blank'
};
</script>
<script src="assets/vendor/docsify.min.js"></script>
<script src="assets/vendor/search.min.js"></script>
</body>
</html>
