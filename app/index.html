<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>吃什么</title>
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0E0D" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="吃什么">
<meta name="description" content="每天吃什么、怎么炒，一周买什么">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <span class="brand">吃什么</span>
  <nav class="jump" id="jump">
    <a href="#s-today" class="on">今天</a>
    <a href="#s-week">这周</a>
    <a href="#s-shop">买菜</a>
  </nav>
</header>

<main>

  <section class="sec" id="s-today">
    <div class="sec-head">
      <div class="head-row">
        <h1 id="today-title">今天</h1>
        <div class="stepper">
          <button data-step="-1" aria-label="前一天">‹</button>
          <button data-step="1" aria-label="后一天">›</button>
        </div>
      </div>
      <p class="sec-sub" id="today-sub"></p>
    </div>

    <div id="today-body"></div>
    <p class="note" id="today-foot"></p>
  </section>

  <section class="sec" id="s-week">
    <div class="sec-head">
      <h1>这周</h1>
      <p class="sec-sub">点某一天，跳回那天的做法。</p>
    </div>
    <div class="week" id="week-list"></div>
  </section>

  <section class="sec" id="s-shop">
    <div class="sec-head">
      <h1>买菜</h1>
      <p class="sec-sub">七天十四份饭的料，买一样划一样。调料不用买。</p>
    </div>
    <div class="shoptop" id="shop-top"></div>
    <div id="shop-list"></div>
    <button class="resetlink" id="reset-check">清空勾选</button>
  </section>

</main>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-mask" data-close></div>
  <div class="sheet-panel">
    <div class="sheet-h">
      <b id="sheet-title">换一道</b>
      <button class="x" data-close>关闭</button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</div>

<script>
(function () {
  var v = '?v=' + Date.now();
  var s = document.createElement('script');
  s.src = 'app.js' + v;
  s.onload = function () {
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    }
  };
  document.body.appendChild(s);
})();
</script>
</body>
</html>
